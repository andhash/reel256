name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: ubuntu-24.04-arm, cc: gcc }
          - { os: macos-15, cc: cc }        # Apple Silicon
          - { os: macos-15-intel, cc: cc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: test
        run: make test CC=${{ matrix.cc }}
      - name: bench (informational; shared runners are noisy)
        run: make bench CC=${{ matrix.cc }}
